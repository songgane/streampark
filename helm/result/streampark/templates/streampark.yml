apiVersion: apps/v1
kind: Deployment
metadata:
  name: streampark
  namespace: streampark
  labels:
    app.kubernetes.io/name: streampark
    app.kubernetes.io/version: "2.1.5"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: streampark-2.1.5
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: streampark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streampark
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - testw04
      serviceAccountName: streampark
      containers:
        - image: registry.tde.sktelecom.com/emergingdp/tlake/streampark:2.1.5-jdk11
          name: streampark
          imagePullPolicy: IfNotPresent
          ports:
            - name: rest
              containerPort: 10000
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Seoul
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            - name: LANG
              value: en_US.UTF-8
            - name: LANGUAGE
              value: en_US:en
            - name: LC_ALL
              value: en_US.UTF-8
          securityContext:
            privileged: false
          livenessProbe:
            httpGet:
              port: 10000
              path: /actuator/health/liveness
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 20
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              port: 10000
              path: /actuator/health/liveness
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 20
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: streampark-default-config-volume
              mountPath: /streampark/conf
            
            - mountPath: /opt/flink
              name: flink-pv
          resources:
            limits:
              cpu: "1"
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: streampark-default-config-volume
          configMap:
            name: streampark-console-config
            items:
              - key: config.yaml
                path: config.yaml
              - key: logback-spring.xml
                path: logback-spring.xml
        
        - name: flink-pv
          persistentVolumeClaim:
            claimName: flink-pvc
